# Tsuki — cấu hình GTK3.
#
# Chỉ khai báo CURSOR. Cố ý KHÔNG khai theme màu hay font ở đây: những thứ
# đó thuộc về xsettingsd/.config/xsettingsd/xsettingsd.conf (Gtk/ThemeName,
# Gtk/FontName) và việc bật daemon đó là một quyết định riêng, không nhét
# vào đây để tránh hai nơi cùng khai một thứ rồi đá nhau.
#
# GTK3 trên X11 đọc cursor theme từ file này. Thiếu nó thì GTK dùng cursor mặc
# định của theme (Adwaita), kể cả khi theme cursor đã được nạp cho X11 core.
[Settings]
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-cursor-theme-size=24
