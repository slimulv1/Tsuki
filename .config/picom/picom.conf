#####################################
#          BACKEND & VSYNC          #
#####################################
backend = "glx";
vsync = true;

# Tối ưu Mesa/AMDGPU
use-damage = true;
xrender-sync-fence = true;

#####################################
#     WINDOW DETECTION & FOCUS      #
#####################################
detect-rounded-corners = true;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;

#####################################
#      TỐI ƯU GAMING (GIỮ NGUYÊN)   #
#####################################
unredir-if-possible = true;
unredir-if-possible-delay = 50;

unredir-if-possible-exclude = [
    "class_g = 'looking-glass-client'"
];

#####################################
#        CORNERS                    #
#####################################
corner-radius = 0;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Xfce4-panel'",
  "class_g = 'Xfce4-screenshooter'",
  "class_g = 'gamescope'",
  "class_g = 'Steam'",
  "class_g ?= 'brave'",
  "class_g ?= 'Brave'",
  "fullscreen"
];

#####################################
#     BLUR (macOS VIBRANCY STYLE)   #
#####################################
blur:
{
  method = "dual_kawase";
  strength = 12;
};

# Blur nền phía sau mọi cửa sổ trong suốt
blur-background = true;
blur-background-frame = true;

# Không blur nền phía sau: gamescope, steam, browser, dwm bar (dock), fullscreen
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'Slop'",
  "class_g = 'Xfce4-screenshooter'",
  "class_g = 'gamescope'",
  "class_g = 'Steam'",
  "class_g ?= 'brave'",
  "class_g ?= 'Brave'",
  "name = 'dwm'",
  "class_g ?= 'Dunst'",
  "fullscreen"
];

#####################################
#   SHADOWS (macOS TAHOE DIFFUSE)   #
#####################################
shadow = true;
shadow-radius = 28;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.35;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'Xfce4-panel'",
  "class_g = 'xfce4-popup-clipman'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'gamescope'",
  "class_g = 'Steam'",
  "class_g ?= 'brave'",
  "class_g ?= 'Brave'",
  "window_type = 'dock'",
  "name = 'dwm'",
  "class_g = 'dwm'",
  "class_g = 'rofi'",
  "class_g ?= 'Dunst'",
  "fullscreen"
];

#####################################
#     FADING (macOS SNAPPY ANIM)    #
#####################################
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 4;

#####################################
#   OPACITY (TRONG SUỐT + BLUR)     #
#####################################
# Mọi cửa sổ trong suốt mặc định (active 82% / inactive 77%) + blur nền
active-opacity = 0.82;
inactive-opacity = 0.77;
frame-opacity = 0.8;

# Giữ 100% ĐỤC cho: gamescope, steam, browser (brave), fullscreen
# dwm bar: 85% (trong suốt nhẹ, xuyên thấy wallpaper)
opacity-rule = [
  "100:class_g = 'dwm'",
  "100:class_g = 'gamescope'",
  "100:class_g = 'Steam'",
  "100:class_g ?= 'brave'",
  "100:class_g ?= 'Brave'",
  "100:window_type = 'dock'",
  "100:name = 'dwm'",
  "70:class_g = 'Code'",
  "70:class_g = 'kitty'",
  "90:class_g = 'Rofi'",
  "60:class_g = 'Spotify'",
  "100:fullscreen",
  "100:window_type = 'fullscreen'",
  "100:_GTK_FRAME_EXTENTS@:c",
  "100:class_g = 'looking-glass-client'"
];

# netpanel popup: shadow + opacity nhẹ cho panel wifi
wintypes: {
  popup_menu = { shadow = true; opacity = 0.95; focus = false; };
  dropdown_menu = { shadow = true; opacity = 0.95; focus = false; };
};
