name: CI

# Chạy static analysis + build + fuzz trên mọi push/PR.
# Mục tiêu: chặn hồi quy cho các lớp lỗi đã vá (xem scripts/fuzz-status.sh).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # -std=c23 cần GCC >= 13, Clang >= 17
  CC_GCC: gcc-14
  CC_CLANG: clang-18

jobs:
  build:
    name: build (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-14, clang-18]
    steps:
      - uses: actions/checkout@v4

      - name: cài dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libx11-dev libxinerama-dev libxft-dev libxrender-dev \
            libfontconfig1-dev libfreetype6-dev libimlib2-dev \
            libxcrypt-dev libwebp-dev libpng-dev \
            libturbojpeg0-dev libjpeg-dev

      - name: compiler phải hỗ trợ C23
        run: |
          ${{ matrix.cc }} --version | head -1
          echo 'int main(void){return __STDC_VERSION__;}' > /tmp/v.c
          if ! ${{ matrix.cc }} -std=c23 /tmp/v.c -o /tmp/v; then
            echo "::error::${{ matrix.cc }} không chấp nhận -std=c23"
            exit 1
          fi
          echo "__STDC_VERSION__ = $(/tmp/v)  (202311 = C23)"

      - name: build dwm (-Werror)
        run: make CC=${{ matrix.cc }} clean all

      - name: build dmenu (-Werror)
        run: make -C dmenu CC=${{ matrix.cc }} clean all

      - name: build st
        run: make -C st CC=${{ matrix.cc }} clean all

      - name: build slock (-Werror)
        run: make -C slock CC=${{ matrix.cc }} clean all

      - name: build slstatus
        run: make -C slstatus CC=${{ matrix.cc }} clean all

      - name: build netpanel (-Werror)
        run: make -C netpanel CC=${{ matrix.cc }} clean all

      - name: build imgdec (-Werror)
        run: make -f scripts/Makefile.imgdec CC=${{ matrix.cc }}

      - name: xác nhận config.h còn nguyên sau `make clean`
        # `make clean` từng xoá config.h rồi tái tạo từ config.def.h, âm thầm
        # thay toàn bộ cấu hình thật của máy. Phải chặn hồi quy này.
        run: |
          before=$(git diff --stat -- config.h)
          make clean
          if [ ! -f config.h ]; then
            echo "::error::make clean đã xoá config.h"
            exit 1
          fi
          after=$(git diff --stat -- config.h)
          if [ "$before" != "$after" ]; then
            echo "::error::make clean đã thay đổi config.h"
            exit 1
          fi
          echo "config.h nguyên vẹn"

  analyze:
    name: static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: cài dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 \
            libx11-dev libxinerama-dev libxft-dev libxrender-dev \
            libfontconfig1-dev libfreetype6-dev libimlib2-dev

      - name: clang --analyze (dwm)
        run: |
          clang-18 --analyze -std=c23 -Xanalyzer -analyzer-output=text \
            -D_DEFAULT_SOURCE -D_BSD_SOURCE -D_XOPEN_SOURCE=700L \
            -DVERSION='"6.8"' -DXINERAMA -I/usr/include/freetype2 \
            dwm.c -o /dev/null
        continue-on-error: true

      - name: gcc -fanalyzer (dwm)
        run: |
          gcc-14 -fanalyzer -std=c23 -O1 \
            -D_DEFAULT_SOURCE -D_BSD_SOURCE -D_XOPEN_SOURCE=700L \
            -DVERSION='"6.8"' -DXINERAMA -I/usr/include/freetype2 \
            -fsyntax-only dwm.c
        continue-on-error: true

      - name: nghiêm ngặt hơn build (chỉ báo lỗi, không fail)
        # Cố tình bật các cờ cảnh báo mà build thường tắt, để lộ vấn đề mới.
        # continue-on-error: cần đọc, không cần chặn PR.
        run: |
          gcc-14 -fsyntax-only -std=c23 \
            -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wsign-conversion \
            -Wcast-qual -Wstrict-prototypes -Wmissing-prototypes \
            -Wold-style-definition -Wundef -Wformat=2 -Wnull-dereference \
            -Wswitch-enum -Wduplicated-cond -Wlogical-op -Wjump-misses-init \
            -Wuninitialized -Wmaybe-uninitialized -Wstringop-overflow \
            -Warray-bounds -Wnonnull -Wbad-function-cast -Wimplicit-fallthrough \
            -D_DEFAULT_SOURCE -D_BSD_SOURCE -D_XOPEN_SOURCE=700L \
            -DVERSION='"6.8"' -DXINERAMA -I/usr/include/freetype2 \
            dwm.c drw.c util.c 2>&1 | tee /tmp/strict.log | tail -40
          echo "--- tổng số cảnh báo: $(grep -c 'warning:' /tmp/strict.log)"

  fuzz-status:
    name: fuzz parser status (dwm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: cài dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 xvfb x11-utils python3-xlib \
            libx11-dev libxinerama-dev libxft-dev libxrender-dev \
            libfontconfig1-dev libfreetype6-dev libimlib2-dev

      - name: chạy fuzz + regression cho drawstatusbar
        # Parser status2d đọc WM_NAME của root window — input không tin cậy.
        # Ba payload dưới đây từng giết dwm; nếu chúng sống lại thì fix đã
        # bị hồi quy.
        run: ./scripts/fuzz-status.sh 4000 48

      - name: dọn artifact nếu có log
        if: always()
        run: |
          if [ -f .fuzz/dwm.log ]; then
            echo "--- dwm.log ---"
            cat .fuzz/dwm.log
          fi
