# Tsuki — cấu hình paru (AUR helper)
#
# VÌ SAO CẦN FILE NÀY: đo trên máy trước khi viết —
#   ~/.config/paru/paru.conf: KHÔNG CÓ
#   GIT_EDITOR, CMAKE: chưa đặt
# paru 2.1.0 chạy với toàn bộ mặc định, tức nó clone PKGBUILD rồi build ngay mà
# không hỏi bạn xem script làm gì. AUR là mã nguồn do người lạ đẩy lên — đọc
# PKGBUILD là biện pháp chống cài nhầm script độc hại, không phải thừa.
#
# CHỈ DÙNG OPTION ĐÃ XÁC MINH TỪ MAN TRÊN MÁY NÀY:
#   man paru.conf(5) của paru 2.1.0
# Cố ý KHÔNG viết PkgBuildCache, ReviewDiff, DiffMenu — đã kiểm cả man
# paru.conf(5) lẫn `strings /usr/bin/paru`, cả ba đều không có trong bản này.
# Trước đây tôi định viết chúng theo trí nhớ từ hướng dẫn paru 1.x; paru 2
# đã bỏ. Viết option không tồn tại là hỏng file cấu hình.
#
# Mọi dòng dưới đây là MẶC ĐỊNH AN TOÀN trừ chỗ ghi rõ — không phải tối ưu.
#
# CẤU TRÚC: `man paru.conf(5)` nói rõ "Options belonging to the [options]
# section" và "Based on the format used by pacman.conf(5)". Bản nháp đầu viết
# option ngay từ dòng đầu, paru 2.1 báo lỗi:
#   error: .../paru.conf:27: key 'SudoLoop' does not belong to a section
# Đo được bằng cách chạy `paru --version` sau khi viết file. Đã thêm `[options]`.
[options]

# --- An toàn khi build AUR ---------------------------------------------------
# KHÔNG bật SkipReview: đó là cờ BẬT để bỏ qua việc đọc PKGBUILD, và đó
# chính là thứ ta muốn giữ. `man paru.conf(5)`: "SkipReview — Skip the review
# process." Không đặt => paru vẫn dừng lại cho bạn xem trước khi build.
#
# SudoLoop: `man` mô tả "Periodically call sudo in the background to prevent
# it from timing out during long builds." Có nó thì không phải gõ mật khẩu
# nhiều lần khi build game hay codec mất nhiều phút.
SudoLoop

# --- Dọn sau khi cài ---------------------------------------------------------
# `man`: "Remove untracked files after installation. Untracked files are removed
# with the exception of directories. This allows VCS packages to easily pull an
# update instead of having to reclone the entire repo."
# Tức xoá file rác trong thư mục build nhưng GIỮ thư mục git — đúng thứ cần:
# lần sau cập nhật thì pull thay vì clone lại từ đầu.
CleanAfter

# Chroot: KHÔNG bật. Bật thì mỗi lần build tạo container, chậm hơn nhiều với
# các gói đơn giản. Bật khi nào thật sự cần (PKGBUILD phá hỏng hệ thống).
# Chroot
