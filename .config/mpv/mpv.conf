# Tsuki — cấu hình mpv
#
# KHÔNG có file này thì mpv chạy đúng như bản dựng: giải mã MỀM, hiển thị mềm,
# không tự nạp phụ đề. Đo trên máy này trước khi viết file này:
#   ~/.config/mpv/ RỖNG, và repo cũng không có .config/mpv/
#
# Mọi option dưới đây đã kiểm bằng `mpv --list-options` trên chính máy, không
# viết theo trí nhớ. Hai option tôi định viết ban đầu KHÔNG tồn tại:
#   - volume-save        → không có trong mpv 0.41
#   - autofit-fullscreen → không có trong mpv 0.41
# Nên không có chúng ở đây.

# --- Hiển thị -----------------------------------------------------------------
# GPU: AMD Radeon RX 7800 XT (Navi 32), driver amdgpu.
# Đo: glxinfo -> radeonsi/navi32 · vulkaninfo -> RADV NAVI32, apiVersion 1.4.354.
# `gpu-next` là backend mới hơn `gpu` và là backend mpv tự khuyên dùng trước
# cả VA-API. `vulkan` đo được hoạt động trên RADV này.
vo=gpu-next
gpu-api=vulkan
# scaler: gpu-hq tự bật `high-quality` + `ewa_lanczossharp` (đọc bằng
# `mpv --show-profile=gpu-hq`). Thêm dither để 8-bit không bị dải màu.
profile=gpu-hq
dither=fruit
dither-depth=auto
# Không đổi tỉ lệ khung hình — phim 21:9/4:3 không bị méo.
keepaspect=yes
# Nhãn phụ đề SRT mặc định không có bóng -> khó đọc trên nền sáng. Đặt viền.
sub-border-size=3
sub-font-size=26

# --- Giải mã -----------------------------------------------------------------
# TÀI LIỆU CHÍNH THỨC nói rõ: "Hardware decoding is not enabled by default,
# to keep the out-of-the-box configuration as reliable as possible."
# Nên mặc định là `hwdec=no` — giải mã MỀM. Đây là lý do phim nặng giật dù GPU
# rảnh. `auto-safe` chỉ bật decoder trong whitelist (khác `auto-unsafe` là bật
# bừa mọi thứ tìm được).
#
# vaapi: đo được `libva` 2.24.1 + `libva-mesa-driver` có sẵn, và tài liệu mpv
# ghi vaapi cần `--vo=gpu` hoặc `--vo=gpu-next` — cả hai đều thoả ở trên.
hwdec=auto-safe
# 4 option trong bản nháp đầu KHÔNG tồn tại trong mpv 0.41, đã bỏ sau khi đối
# chiếu `mpv --list-options`:
#   - hwdec-extra-hooks  (có `hwdec-extra-frames`, khác nghĩa)
#   - screenshot         (option cờ; mpv 0.41 chỉ còn --screenshot-format)
#   - screenshot-flags   (không có trong bản này)
#   - sub-auto-fuzzy     (`fuzzy` là GIÁ TRỊ của --sub-auto, không phải option riêng)

# --- Phụ đề -------------------------------------------------------------------
# `all` = fuzzy + nạp cả file phụ đề nằm cùng thư mục. exact là mặc định.
sub-auto=all

# --- Âm thanh ----------------------------------------------------------------
# PipeWire là server đang chạy (đo: 41 module, sink USB Audio + GSX 300).
# Để `auto` để mpv tự chọn — ép tên sink sẽ hỏng khi bạn đổi loa.
audio-device=auto
# `audio` là mặc định và đúng cho phim: khớp âm thanh với số khung hình.
video-sync=audio
# Nhạc/giọng nói: thêm mốc thời gian để tua nhanh.
osd-fractions=yes

# --- Đồng bộ video mượt ------------------------------------------------------
# `display-resample` khử rung khung hình ở 24fps, nhưng chỉ bật trong profile
# riêng vì nó đổi pitch audio khi lệch frame. Bật khi cần xem phim mượt:
#   mpv --profile=reduce-judder <file>
# profile này đã có sẵn trong mpv, không cần viết thêm.

# --- Ghi hình ----------------------------------------------------------------
# mpv 0.41 bỏ option `screenshot` (kiểu cờ) và `screenshot-flags`. Chỉ còn
# --screenshot-format, và mặc định là jpg — nên đặt png để không mất chất lượng.
# `~/Pictures` là thư mục XDG đã được install.sh tạo và khai (cmd_userdirs).
screenshot-format=png
screenshot-template=~/Pictures/%y-%m-%d-%Hh%Mm%Ss-%f
