<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="moon" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="55%" stop-color="#cbd5f5"/>
      <stop offset="100%" stop-color="#a5b4e0"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0a6c8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f0a6c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- No background (transparent for GitHub), just moon + a few floating stars -->
  <circle cx="104" cy="120" r="4.5" fill="#ffffff" opacity="0.75"/>
  <circle cx="430" cy="92" r="3.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="120" cy="356" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="412" cy="380" r="4" fill="#ffffff" opacity="0.55"/>
  <circle cx="240" cy="84" r="3" fill="#ffffff" opacity="0.55"/>
  <circle cx="360" cy="150" r="3" fill="#ffffff" opacity="0.6"/>

  <!-- Craters -->
  <ellipse cx="155" cy="270" rx="34" ry="26" fill="#a9b6d8" opacity="0.5"/>
  <ellipse cx="350" cy="300" rx="28" ry="22" fill="#a9b6d8" opacity="0.45"/>
  <ellipse cx="270" cy="360" rx="20" ry="16" fill="#a9b6d8" opacity="0.4"/>

  <!-- Moon face -->
  <circle cx="256" cy="256" r="170" fill="url(#moon)"/>

  <!-- Eyes -->
  <ellipse cx="205" cy="240" rx="14" ry="18" fill="#1a1b26"/>
  <ellipse cx="307" cy="240" rx="14" ry="18" fill="#1a1b26"/>
  <!-- Eye shine -->
  <circle cx="211" cy="233" r="5" fill="#ffffff" opacity="0.85"/>
  <circle cx="313" cy="233" r="5" fill="#ffffff" opacity="0.85"/>

  <!-- Blush -->
  <ellipse cx="180" cy="285" rx="26" ry="14" fill="url(#cheek)"/>
  <ellipse cx="332" cy="285" rx="26" ry="14" fill="url(#cheek)"/>

  <!-- Smile -->
  <path d="M 228 288 Q 256 314 284 288" stroke="#1a1b26" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Small ears/cat-nub on top (kemonomimi vibe) -->
  <path d="M 236 108 L 222 60 L 258 86 Z" fill="#a5b4e0"/>
  <path d="M 276 108 L 290 60 L 254 86 Z" fill="#a5b4e0"/>
</svg>
