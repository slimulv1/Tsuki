# Font Configuration
font_family      CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0
# Window Configuration
window_padding_width 12
# subtle translucent background — paired with background_blur below
background_opacity 0.92
background_blur 32
#hide_window_decorations no
confirm_os_window_close 0

# Cursor Configuration — beam keeps the caret surgical for code editing
cursor_shape beam
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# BEGIN_KITTY_THEME
include tokyo-night.conf
# NOTE (Arisa): pywal.conf (wallpaper-derived colors) was overriding Tokyo Night
# colors, breaking the look vs the starship prompt. Đã tắt hẳn — dwmwal.sh không
# còn tự append dòng này nữa (đã sửa trong dwmwal.sh). Muốn màu wallpaper thì
# mở comment dòng dưới bằng tay:
# include pywal.conf

# ── Arisa's touch 💜 — điểm nhấn tím khớp với prompt starship ❯ ──
cursor #bb9af7               # con trỏ tím — đồng bộ với dấu nhắc ❯ của em
cursor_text_color #1a1b26
active_border_color #bb9af7  # viền cửa sổ active màu tím
selection_background #3b4261 # vùng chọn dịu mắt hơn
include pywal.conf
