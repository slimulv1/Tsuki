# xsettingsd — phát XSETTINGS cho app GTK trên dwm.
#
# Daemon này CHƯA TỪNG chạy: install.sh cài gói, nhưng run.sh không khởi động,
# nên toàn bộ file này là cấu hình chết. Đã nối vào run.sh (start_daemon).
#
# xsettingsd tự tìm file này ở ~/.config/xsettingsd/xsettingsd.conf, nên không
# cần truyền -c.
#
# ⚠ CÓ GIỚI HẠN — ĐỪNG KỲ VỌNG NÓ ĐỔI CON TRỎ CỦA dwm/st:
#   xsettingsd KHÔNG hỗ trợ cursor theme. Đã kiểm: binary không chứa chuỗi
#   "cursor" nào, man page không nhắc. Nó chỉ PHÁT Gtk/CursorThemeName qua
#   XSETTINGS cho app GTK đọc. Còn dwm và st tự gọi XCreateFontCursor() — mà
#   X11 hiện đại không còn đường nạp theme vào core cursor font — nên chúng tự
#   đọc file cursor trong theme (drw_cur_load() ở drw.c, load_themed_cursor() ở
#   st/x.c). Chi tiết: xem comment khối cursor trong scripts/run.sh.

# --- Theme màu / icon ---------------------------------------------------------
# Hai theme này KHÔNG có trong kho Arch/CachyOS/arisa, cũng không có trong AUR
# — phải cài từ git. install.sh lo (cmd_themes), nên khi clone máy mới chạy
# ./install.sh là có. Cài ở mức user nên không cần root:
#   Miami26      -> ~/.themes/Miami26          (từ Themes/Miami26)
#   yet-another-monochrome-icon-set -> ~/.local/share/icons/yet-another-monochrome-icon-set
#   Buuf-For-Many-Desktops          -> ~/.local/share/icons/Buuf-For-Many-Desktops
# Cài bằng `./install.sh icons`. Kora vẫn còn trên máy nhưng không phải icon
# chính nữa.
#
# Tên theme trong config phải khớp TÊN THƯ MỤC sau khi cài, không phải Name=
# trong index.theme (Kora khai Name=Kora Grey nhưng GTK tra theo tên thư mục).
# YAMO khai Name=yet-another-monochrome-icon-set, trùng tên thư mục.
#
# Vì sao YAMO làm icon chính — đo trên máy này, không đoán: tham chiếu 46 icon
# từ mọi .desktop trong hệ thống, YAMO có 41/46, kora 36/46, Buuf 36/46.
# YAMO thiếu 5, đã tra từng cái: 4 tìm thấy trong theme dự phòng (Adwaita /
# breeze-dark / hicolor), cái thứ 5 (flatpak-symbolic) thuộc app `shelly-ui`
# mà máy chưa cài nên không hiện ra.
# Buuf làm dự phòng: 137 MB, và không có icon app nào (0 file trong apps/).
Net/ThemeName "Miami26"
Net/IconThemeName "yet-another-monochrome-icon-set"

# --- Font --------------------------------------------------------------------
# Tên họ font phải khớp CHÍNH XÁC fontconfig. "JetBrains Mono" (có khoảng trắng)
# không tồn tại ở đây — font cài là bản nerd, họ là "JetBrainsMono Nerd Font".
# Sai tên thì fontconfig rơi về Noto Sans Mono, tức monospace đổi màu im lặng.
Gtk/FontName "Noto Sans 10"
Gtk/MonospaceFontName "JetBrainsMono Nerd Font 10"

# --- Cursor ------------------------------------------------------------------
# Chỉ có tác dụng với app GTK3. Xem cảnh báo ở đầu file.
Gtk/CursorThemeName "Bibata-Modern-Ice"
Gtk/CursorThemeSize 24

# --- Còn lại -----------------------------------------------------------------
Gtk/ColorScheme "prefer-dark"
Gtk/EnableAnimations 1
# CSD: dwm không bật client-side decoration nên dòng này vô tác dụng ở đây.
# Giữ lại phòng khi sau này bật CSD cho app.
Gtk/DecorationLayout "menu:minimize,maximize,close"
